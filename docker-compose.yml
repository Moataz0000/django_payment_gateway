version: '3.8'

services:
  web:
    build: .
    container_name: django_payment_mezo
    ports:
      - "8000:8000"
    volumes:
      - .:/app 
    environment:
      - DEBUG=True
    command: >
      sh -c "while true; do
               python manage.py migrate &&
               python manage.py runserver 0.0.0.0:8000;
               echo 'Server crashed. Restarting in 3 seconds...';
               sleep 3;
             done"
